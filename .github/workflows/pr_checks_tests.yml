name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr_checks_tests:
    name: PR Checks Tests
    runs-on: ubuntu-latest

    steps:
      # The wiki gate resolves every citation in the tree its repository is
      # pinned to, so the tests covering it need that commit fetched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gate's Nexus-side checks resolve citations in the Nexus tree, which
      # `check_wiki.NEXUS_ROOT` looks for beside this one. That sits outside the
      # workspace, so `actions/checkout` cannot place it there and it is cloned
      # instead. Fourteen tests skip without it, and the suite reported green
      # having skipped them; they stay skipped until NEXUS_READ_TOKEN is set.
      - name: Clone Nexus beside it
        if: ${{ secrets.NEXUS_READ_TOKEN != '' }}
        env:
          NEXUS_READ_TOKEN: ${{ secrets.NEXUS_READ_TOKEN }}
        run: |
          git clone --no-single-branch \
            "https://x-access-token:${NEXUS_READ_TOKEN}@github.com/Vaquum/Nexus.git" \
            ../Nexus

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest -v
