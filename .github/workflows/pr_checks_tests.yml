name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr_checks_tests:
    name: PR Checks Tests
    runs-on: ubuntu-latest

    steps:
      # The wiki gate resolves every citation in the tree its repository is
      # pinned to, so the tests covering it need that commit fetched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Build isolated Binsim reader image
        run: docker build -f Dockerfile.binsim-reader -t binsim-reader:check .
